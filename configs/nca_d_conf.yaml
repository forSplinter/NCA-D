# === Dataset ===
dataset: "sl10"

# === Cellular automata parameters ===
n_channel :  32
fire_rate: 0.3
hidden_channels: 256 

experiment_map:
  Growing: 0
  Persistent: 1
  Regenerating: 2

#=== Training parameters ===
batch_size: 1
epochs: 10000 
n_steps: 148 #[64 - 96 - 128 - 132 - 148]
lr: 0.001
lr_gamma: 0.999
targets_label: 3

#=== Pattern Pool parameters ===
pool_size: 1024
experiment_type: "Persistent"

use_pattern_pool: true
damage_n: 0

#=== Checkpoint ===
checkpoint_path: "checkpoints/NCAModel_p.pt"

